[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brahim-chess"
version = "0.1.0"
description = "Behavioral cloning of a human chess player with Transformers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Brahim Khattara" }]
dependencies = [
  "torch>=2.1.0",
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "matplotlib>=3.7.0",
  "chess>=1.10.0",
  "requests>=2.31.0",
  "streamlit>=1.28.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4.0"]

[tool.setuptools.packages.find]
include = ["brahim_chess*"]
